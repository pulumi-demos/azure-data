name: ${PROJECT}
description: ${DESCRIPTION}
runtime:
  name: python
  options:
    virtualenv: venv
packages:
  pulumi-resource-databricks-workspace: github.com/pulumi-demos/azure-data.git/components/databricks-workspace@v0.0.1
template:
  displayName: Team Onboarding (Python)
  description: >
    Golden path for onboarding a new team to the Azure Data Platform.
    Provisions a compliant, network-isolated Databricks workspace with
    hub/spoke peering and an Entra ID service principal — all powered by
    the published DatabricksWorkspaceComponent.
  config:
    teamName:
      description: Your team name (e.g., data-science, analytics-eng)
      default: my-team
    environment:
      description: Target environment (dev, staging, prod)
      default: dev
    costCenter:
      description: Cost center code for chargeback
      default: CC-UNASSIGNED
    spokeCidr:
      description: CIDR block for your spoke VNet (must not overlap hub or other spokes)
      default: "10.1.0.0/16"
    hubStackRef:
      description: Stack reference to the hub-network stack
      default: demo/azure-data-hub-network/dev
    azure-native:subscriptionId:
      description: Azure subscription ID for this team's resources
  metadata:
    cloud: azure
    language: python
    category: data-platform
