# Stack configuration for Team Alpha (Data Science)
# This demonstrates subscription-as-parameter pattern
environment:
  - azure-data/spoke-team-alpha
config:
  # Team-specific configuration (inherited from ESC, can be overridden)
  team-onboarding:teamName: team-alpha
  team-onboarding:environment: dev
  team-onboarding:costCenter: CC-DATA-SCIENCE-001
  
  # Network configuration
  team-onboarding:spokeCidr: "10.1.0.0/16"
  
  # Hub stack reference for peering
  team-onboarding:hubStackRef: demo/hub-network/dev
