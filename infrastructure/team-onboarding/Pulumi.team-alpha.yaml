# Stack configuration for Team Alpha (Data Science)
# This demonstrates subscription-as-parameter pattern
environment:
  - azure-data/spoke-team-alpha
config:
  # Team-specific configuration (inherited from ESC, can be overridden)
  azure-data-team-onboarding:teamName: team-alpha
  azure-data-team-onboarding:environment: dev
  azure-data-team-onboarding:costCenter: CC-DATA-SCIENCE-001
  
  # Network configuration
  azure-data-team-onboarding:spokeCidr: "10.1.0.0/16"
  
  # Hub stack reference for peering
  azure-data-team-onboarding:hubStackRef: demo/azure-data-hub-network/dev

  # Entra ID auth: use Azure CLI (OIDC SP lacks directory permissions)
  # Must explicitly disable OIDC since ESC injects ARM_USE_OIDC env var
  azuread:useCli: "true"
  azuread:useOidc: "false"
