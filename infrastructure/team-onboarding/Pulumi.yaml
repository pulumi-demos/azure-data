name: azure-data-team-onboarding
description: |
  Golden path stack for onboarding new teams to the Azure Data Platform.
  Uses the DatabricksWorkspaceComponent to provision compliant, network-isolated
  Databricks workspaces with hub/spoke connectivity.
runtime:
  name: python
  options:
    virtualenv: venv
packages:
  pulumi-resource-databricks-workspace: github.com/pulumi-demos/azure-data.git/components/databricks-workspace@v0.0.1
