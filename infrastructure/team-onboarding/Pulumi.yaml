name: azure-data-team-onboarding
description: |
  Golden path stack for onboarding new teams to the Azure Data Platform.
  Uses the DatabricksWorkspaceComponent to provision compliant, network-isolated
  Databricks workspaces with hub/spoke connectivity.
runtime:
  name: python
  options:
    virtualenv: venv
packages:
  azure-data-databricks-workspace: github.com/pulumi-demos/azure-data-databricks-workspace@v0.0.2
  azure-data-team-entra: github.com/pulumi-demos/azure-data-team-entra@v0.1.0
