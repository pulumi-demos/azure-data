# Stack configuration for Team Beta (Analytics Engineering)
# Different subscription, different CIDR - same golden path
environment:
  - azure-data/spoke-team-beta
config:
  azure-data-team-onboarding:teamName: team-beta
  azure-data-team-onboarding:environment: dev
  azure-data-team-onboarding:costCenter: CC-ANALYTICS-002
  azure-data-team-onboarding:spokeCidr: "10.2.0.0/16"
  azure-data-team-onboarding:hubStackRef: demo/azure-data-hub-network/dev

  # Entra ID auth: use Azure CLI (OIDC SP lacks directory permissions)
  # Must explicitly disable OIDC since ESC injects ARM_USE_OIDC env var
  azuread:useCli: "true"
  azuread:useOidc: "false"
